services:
  db.zenon.fraud:
    image: mysql:9
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pass123
      MYSQL_DATABASE: zenon_fraud
    ports:
      - '3309:3306'
    volumes:
      - mysql.zenon.fraud:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro
volumes:
  mysql.zenon.fraud:
